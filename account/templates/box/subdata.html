

<!DOCTYPE html>

<html> 
    <head>     
        <title>Subject List</title>   
          <style>    
                 body { 
                        font-family: Arial;          
                          background: #f4f4f4;           
                            padding: 20px;       
                          }


    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        background: #007bff;
        color: white;
    }

    a {
        color: blue;
    }
</style>


</head> <body>

<h2>Subject Details</h2>

<table>     
    <tr>         
        <th>ID

        </th>         
        <th>Name</th>         
        <th>PDF</th>         
        <th>Code</th>         
        <th>Title</th>     
        </tr>


{% for sub in subjects %}
<tr>
    <td>{{ sub.id }}</td>
    <td>{{ sub.name }}</td>
    <td>
        {% if sub.pdf %}
            <a href="{{ sub.pdf.url }}" target="_blank">View PDF</a>
            <a href="{{ sub.pdf.url }}" download>Download</a>
        {% else %}
            No PDF
        {% endif %}
    </td>
    <td>{{ sub.code }}</td>
    <td>{{ sub.title }}</td>
</tr>

{% empty %}
<tr>
    <td colspan="5">No Subject Found</td>
</tr>
{% endfor %}


</table>
