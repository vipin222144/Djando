<h2>Login</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">Login</button>
</form>

<a href="{% url 'signup' %}">Create a new account</a>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}
