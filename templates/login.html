
<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

    <h2>Student Records</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody>
            {% for s in student %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.age }}</td>
                <td>{{ s.course }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No student records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
<a href="/login/">List</a>




</body>
</html>
